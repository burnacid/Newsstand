<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#047857">
    <title>Offline - Newsstand</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { --paper: #fdfcf9; --ink: #1b1814; --muted: #71717a; --accent: #047857; --accent-ink: #ffffff; color-scheme: light dark; }
        @media (prefers-color-scheme: dark) {
            :root { --paper: #09090b; --ink: #f4f4f5; --muted: #a1a1aa; --accent: #10b981; --accent-ink: #022c22; }
            .mark-light { display: none; }
            .mark-dark { display: block !important; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 26rem; text-align: center; }
        img { width: 56px; height: 56px; margin: 0 auto 24px; display: block; }
        .mark-dark { display: none; }
        h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 1.75rem; margin: 0 0 8px; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
        button { font: inherit; font-weight: 500; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img class="mark-light" src="/brand/newsstand-mark.svg" alt="">
        <img class="mark-dark" src="/brand/newsstand-mark-dark.svg" alt="">
        <h1>You're offline</h1>
        <p>Newsstand needs a connection to load your news. Check your connection and try again.</p>
        <button type="button" data-test="offline-retry" onclick="location.reload()">Try again</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
