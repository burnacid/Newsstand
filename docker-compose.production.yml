# Newsstand production stack.
#
#   cp .env.production.example .env.production   # then edit it
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d
#   (add --build to build from this checkout instead of pulling burnacid/newsstand)
#
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx, Cloudflare Tunnel)
# in front of port ${APP_PORT:-8080}. See README.md.

name: newsstand-production

x-app: &app
  # Published image; `--build` builds it from this checkout instead.
  image: burnacid/newsstand:${NEWSSTAND_IMAGE_TAG:-latest}
  build: .
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker: feed fetching, CVE lookups, rules, emails.
  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    environment:
      CONTAINER_ROLE: worker
    # Let running jobs finish on deploys (Horizon stops taking new ones on SIGTERM).
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  # Runs scheduled tasks every minute (fetching, KEV sync, digests, pruning).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: worker
    healthcheck:
      # The scheduler writes a heartbeat every minute.
      test: ["CMD", "php", "artisan", "scheduler:check"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${DB_DATABASE:-newsstand}
      POSTGRES_USER: ${DB_USERNAME:-newsstand}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-newsstand}", "-U", "${DB_USERNAME:-newsstand}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  storage:
  pgdata:
  redisdata:
